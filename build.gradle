plugins {
    id "fabric-loom" version "1.13-SNAPSHOT"
    id "java"
    id "maven-publish"
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

java {
    withSourcesJar()
}

loom {
    // We keep the Access Widener file in the former `common/` tree.
    accessWidenerPath = file("common/src/main/resources/better_loading_screen.accesswidener")
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "better_loading_screen.refmap.json"
    }
}

sourceSets {
    main {
        java {
            srcDir "common/src/main/java"
            srcDir "fabric/src/main/java"
        }
        resources {
            srcDir "common/src/main/resources"
            srcDir "fabric/src/main/resources"
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Bundle runtime dependency into the mod jar (loom will include it when running remapJar).
    include(implementation("blue.endless:jankson:1.2.1"))
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = project.archives_base_name
        }
    }
}
